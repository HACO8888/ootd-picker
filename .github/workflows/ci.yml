name: CI

on:
  push:
    branches: [main]
  pull_request:

# 唯讀權限：CI 只需讀取程式碼，不寫入 repo、不發佈。
permissions:
  contents: read

# Dummy values so the app boots in CI: postgres.js connects lazily, so a
# placeholder DATABASE_URL is enough for build and guest-mode e2e (which never
# hit the DB). Override with real secrets if/when authed e2e is added.
env:
  DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
  AUTH_SECRET: ci-dummy-secret-not-used-in-production
  AUTH_URL: http://localhost:4599
  AUTH_TRUST_HOST: "true"
  NEXT_PUBLIC_SITE_URL: http://localhost:4599

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      # webServer in playwright.config.ts builds + starts the app on PORT 4599.
      - run: pnpm test:e2e
